name: Deploy Smoke Test

on:
  pull_request:
    paths:
      - '.github/release/**'
      - 'deploy/scripts/**'
      - 'docker/**'
      - 'Dockerfile'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Assemble release
        run: bash .github/release/assemble.sh

      - name: Init (generates secrets)
        run: |
          cd skerry
          ./scripts/start.sh --init-only

      - name: Verify .env.ops
        run: |
          grep -q 'POSTGRES_PASSWORD=' skerry/.env.ops || { echo "FAIL"; exit 1; }
          grep -q 'SESSION_SECRET=' skerry/.env.ops || { echo "FAIL"; exit 1; }
          grep -q 'CLOUDFLARE_TUNNEL_TOKEN=' skerry/.env.ops || { echo "FAIL"; exit 1; }
          echo "OK: release package assembles and init generates .env.ops"

      - name: Tear down
        if: always()
        run: cd skerry && docker compose down -v 2>/dev/null || true
