name: Publish Docker Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.0-alpha)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  DOCKER_BUILDKIT: 1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        target:
          - name: control-plane
            docker-target: control-plane
          - name: web
            docker-target: web
          - name: sticker-renderer
            docker-target: sticker-renderer

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner (GHCR requires lowercase image names)
        id: repo
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.target.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target.docker-target }}
          push: true
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.owner }}/skerry-${{ matrix.target.name }}:buildcache
          cache-to: |
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.owner }}/skerry-${{ matrix.target.name }}:buildcache,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.owner }}/skerry-${{ matrix.target.name }}:${{ github.event.inputs.version }}
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.owner }}/skerry-${{ matrix.target.name }}:latest

  smoke:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Tag images locally
        run: |
          docker pull ghcr.io/secarelupus/skerry-control-plane:${{ github.event.inputs.version }}
          docker pull ghcr.io/secarelupus/skerry-web:${{ github.event.inputs.version }}
          docker pull ghcr.io/secarelupus/skerry-sticker-renderer:${{ github.event.inputs.version }}

      - name: Assemble and deploy
        run: |
          bash .github/release/assemble.sh
          cd skerry
          ./scripts/start.sh

      - name: Verify .env.ops
        run: |
          grep -q 'POSTGRES_PASSWORD=' skerry/.env.ops || { echo "FAIL"; exit 1; }
          grep -q 'SESSION_SECRET=' skerry/.env.ops || { echo "FAIL"; exit 1; }
          echo "OK: .env.ops generated"

      - name: "Debug: service status"
        if: always()
        run: |
          cd skerry
          echo "=== docker compose ps ==="
          docker compose ps
          echo ""
          echo "=== logs (any exited/dead services) ==="
          for svc in $(docker compose ps --status exited --status dead -q 2>/dev/null); do
            echo "--- $svc ---"
            docker compose logs "$svc" 2>&1 | tail -50
          done
          echo ""
          echo "=== control-plane logs ==="
          docker compose logs control-plane 2>&1 | tail -30
          echo ""
          echo "=== postgres logs ==="
          docker compose logs postgres 2>&1 | tail -20
          echo ""
          echo "=== synapse logs ==="
          docker compose logs synapse 2>&1 | tail -20

      - name: Wait for services healthy
        run: |
          cd skerry
          for i in $(seq 1 60); do
            echo "[$i/60] checking health..."
            if docker compose exec caddy wget -nv -O- http://localhost/health 2>&1; then
              echo "OK: services healthy"; exit 0
            fi
            sleep 5
          done
          echo "FAIL: health check never succeeded"
          echo "=== final caddy logs ==="
          docker compose logs caddy 2>&1 | tail -30
          exit 1

      - name: Verify web UI
        run: |
          cd skerry
          docker compose exec caddy wget -qO- http://localhost/ | grep -q 'Skerry' || { echo "FAIL"; exit 1; }
          echo "OK: web UI serves Skerry"

      - name: Tear down
        if: always()
        run: cd skerry && docker compose down -v 2>/dev/null || true

  release:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Create git tag
        run: |
          git tag ${{ github.event.inputs.version }}
          git push origin ${{ github.event.inputs.version }}

      - name: Package deploy kit
        run: |
          bash .github/release/assemble.sh
          tar -czf skerry-deploy-${{ github.event.inputs.version }}.tar.gz skerry/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          files: skerry-deploy-${{ github.event.inputs.version }}.tar.gz
          generate_release_notes: true

      - name: Upload deploy kit (backup artifact)
        uses: actions/upload-artifact@v4
        with:
          name: skerry-deploy-${{ github.event.inputs.version }}
          path: skerry-deploy-${{ github.event.inputs.version }}.tar.gz
          retention-days: 90
